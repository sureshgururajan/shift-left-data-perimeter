name: Shift-Left Data Perimeter Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  data-perimeter-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CDK Dependencies
        run: |
          cd cdk
          npm ci

      - name: Synthesize CloudFormation Template
        run: |
          cd cdk
          npx aws-cdk synth

      - name: Run Orchestration Agent Reviewer
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent/agent_reviewer.py cdk/cdk.out/DataPerimeterStack.template.json

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const findingComment = fs.readFileSync('finding_comment.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: findingComment
            });
